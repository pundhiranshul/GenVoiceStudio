<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#232326"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </radialGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9C9CE"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#bg)"/>
  <rect x="1" y="1" width="198" height="198" rx="43" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>

  <!-- Soundwave bars -->
  <rect x="22"  y="75"  width="20" height="50"  rx="10" fill="url(#bar)" opacity="0.55"/>
  <rect x="56"  y="55"  width="20" height="90"  rx="10" fill="url(#bar)" opacity="0.80"/>
  <rect x="90"  y="35"  width="20" height="130" rx="10" fill="url(#bar)" opacity="1"/>
  <rect x="124" y="55"  width="20" height="90"  rx="10" fill="url(#bar)" opacity="0.80"/>
  <rect x="158" y="75"  width="20" height="50"  rx="10" fill="url(#bar)" opacity="0.55"/>
</svg>
